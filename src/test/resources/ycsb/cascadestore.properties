# YCSB binding for CascadeStore (embedded Java LSM).
# Use with:
#   java -cp ... site.ycsb.Client -load -db io.cascadestore.lsm.benchmark.ycsb.CascadeStoreYcsbClient \
#     -P src/test/resources/ycsb/cascadestore.properties -P workloads/workloada -s

cascadestore.datadir=/tmp/ycsb-cascade-data
cascadestore.reset.datadir=true
cascadestore.memtable.mb=16
cascadestore.compaction.strategy=LEVEL_TIERED
cascadestore.compaction.threshold=4
cascadestore.compaction.interval.minutes=30
cascadestore.flush.interval.seconds=10
cascadestore.cleanup.interval.minutes=1
cascadestore.shards=1
